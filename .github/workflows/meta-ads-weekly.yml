name: Meta Ads weekly intelligence

on:
  push:
    branches: [main]
    paths: ['imports/current/**/*.csv']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: meta-ads-weekly
  cancel-in-progress: false

jobs:
  weekly:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
      CLOUD_RUN_JOB_NAME: ${{ vars.CLOUD_RUN_JOB_NAME || secrets.CLOUD_RUN_JOB_NAME || 'competitors-report' }}
      FIRESTORE_PROJECT_ID: ${{ vars.FIRESTORE_PROJECT_ID || secrets.FIRESTORE_PROJECT_ID || vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      META_ADS_RESULT_COLLECTION: ${{ vars.META_ADS_RESULT_COLLECTION || secrets.META_ADS_RESULT_COLLECTION || 'meta_ads_processing_results' }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT || secrets.GCP_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-cloud-firestore

      - name: Prepare current weekly batch
        id: prepare
        run: python -m meta_ads_intelligence.weekly_pipeline --prepare-only

      - name: Validate Cloud Run configuration
        if: steps.prepare.outputs.has_batch == 'true'
        shell: bash
        run: |
          missing=0
          for name in GCP_PROJECT_ID GCP_REGION GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT
          do
            if [ -z "${!name}" ]; then
              echo "::error::Required configuration is missing: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Authenticate Google Cloud
        if: steps.prepare.outputs.has_batch == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: steps.prepare.outputs.has_batch == 'true'
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Process videos one by one with 5-minute gap
        if: steps.prepare.outputs.has_batch == 'true'
        shell: bash
        env:
          CLOUD_RUN_PROCESSING_ENABLED: 'true'
        run: |
          cp docs/data/processing_input.json /tmp/meta-ads-full-batch.json

          mapfile -t AD_IDS < <(
            python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/meta-ads-full-batch.json").read_text(encoding="utf-8"))
          for item in data.get("items") or []:
              ad_id = str(item.get("ad_id") or "").strip()
              if ad_id:
                  print(ad_id)
          PY
          )

          total="${#AD_IDS[@]}"
          echo "Videos to process: ${total}"

          for index in "${!AD_IDS[@]}"; do
            ad_id="${AD_IDS[$index]}"
            number=$((index + 1))

            echo "========================================"
            echo "Processing video ${number}/${total}: ${ad_id}"
            echo "========================================"

            python - "$ad_id" <<'PY'
          import json
          import sys
          from pathlib import Path

          ad_id = sys.argv[1]
          full = json.loads(Path("/tmp/meta-ads-full-batch.json").read_text(encoding="utf-8"))
          selected = [
              item
              for item in (full.get("items") or [])
              if str(item.get("ad_id") or "").strip() == ad_id
          ]

          Path("docs/data/processing_input.json").write_text(
              json.dumps(
                  {"source": "meta_ads", "items": selected},
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )
          PY

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

            git add -- docs/data/processing_input.json

            if ! git diff --cached --quiet; then
              git commit -m "Prepare Meta Ads video ${ad_id}"
              git push origin HEAD:main
            fi

            input_sha="$(git rev-parse HEAD)"
            processing_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${input_sha}/docs/data/processing_input.json"
            run_id="meta-ads-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${number}"

            META_ADS_INPUT_URL="${processing_url}" \
            META_ADS_RUN_ID="${run_id}" \
            python -m meta_ads_intelligence.weekly_pipeline \
              --process-ad "${ad_id}" \
              --processing-url "${processing_url}" \
              --run-id "${run_id}"

            git add -- docs/data/latest.json data/video-analysis-cache.json

            if ! git diff --cached --quiet; then
              git commit -m "Save Meta Ads analysis ${ad_id}"
              git push origin HEAD:main
            else
              echo "No analysis changes to save for ${ad_id}"
            fi

            echo "Saved result for ${ad_id} to main."

            if [ "${number}" -lt "${total}" ]; then
              echo "Waiting 5 minutes before the next video..."
              sleep 300
            fi
          done
