name: Meta Ads weekly intelligence

on:
  push:
    branches: [main]
    paths: ['imports/current/**/*.csv']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: meta-ads-weekly
  cancel-in-progress: false

jobs:
  weekly:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      # Video analysis is part of the normal workflow.
      # If a batch exists, the workflow must either analyze it or fail loudly.
      CLOUD_RUN_PROCESSING_ENABLED: 'true'

      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
      CLOUD_RUN_JOB_NAME: ${{ vars.CLOUD_RUN_JOB_NAME || secrets.CLOUD_RUN_JOB_NAME || 'competitors-report' }}
      FIRESTORE_PROJECT_ID: ${{ vars.FIRESTORE_PROJECT_ID || secrets.FIRESTORE_PROJECT_ID || vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      META_ADS_RESULT_COLLECTION: ${{ vars.META_ADS_RESULT_COLLECTION || secrets.META_ADS_RESULT_COLLECTION || 'meta_ads_processing_results' }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT || secrets.GCP_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-cloud-firestore

      - name: Prepare current weekly batch
        id: prepare
        run: python -m meta_ads_intelligence.weekly_pipeline --prepare-only

      - name: Validate Cloud Run configuration
        if: steps.prepare.outputs.has_batch == 'true'
        shell: bash
        run: |
          missing=0

          for name in \
            GCP_PROJECT_ID \
            GCP_REGION \
            GCP_WORKLOAD_IDENTITY_PROVIDER \
            GCP_SERVICE_ACCOUNT
          do
            if [ -z "${!name}" ]; then
              echo "::error::Required configuration is missing: ${name}"
              missing=1
            fi
          done

          if [ "${CLOUD_RUN_PROCESSING_ENABLED}" != "true" ]; then
            echo "::error::CLOUD_RUN_PROCESSING_ENABLED must be true when videos require processing."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "::error::Video analysis cannot start. Refusing to publish an incomplete report."
            exit 1
          fi

      - name: Publish batch and pin input URL to commit
        id: publish
        if: steps.prepare.outputs.has_batch == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- docs/data/processing_input.json

          if ! git diff --cached --quiet; then
            git commit -m 'Update Meta Ads processing input'
          fi

          git push origin HEAD:main

          sha=$(git rev-parse HEAD)
          echo "input_url=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${sha}/docs/data/processing_input.json" >> "$GITHUB_OUTPUT"

      - name: Authenticate Google Cloud
        id: auth
        if: steps.prepare.outputs.has_batch == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        id: gcloud
        if: steps.prepare.outputs.has_batch == 'true'
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Process once and build current weekly report
        env:
          CLOUD_RUN_PROCESSING_ENABLED: ${{ steps.prepare.outputs.has_batch == 'true' && 'true' || 'false' }}
          META_ADS_INPUT_URL: ${{ steps.publish.outputs.input_url }}
          META_ADS_RUN_ID: meta-ads-${{ github.run_id }}-${{ github.run_attempt }}
        run: python -m meta_ads_intelligence.weekly_pipeline

      - name: Verify all requested videos were processed
        if: steps.prepare.outputs.has_batch == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          processing = json.loads(Path("docs/data/processing_input.json").read_text(encoding="utf-8"))
          latest = json.loads(Path("docs/data/latest.json").read_text(encoding="utf-8"))

          requested = {
              str(item.get("ad_id") or "").strip()
              for item in (processing.get("items") or [])
              if str(item.get("ad_id") or "").strip()
          }

          by_id = {
              str(item.get("ad_id") or "").strip(): item
              for item in (latest.get("ads") or [])
          }

          unresolved = []
          failed = []

          for ad_id in requested:
              status = str((by_id.get(ad_id) or {}).get("analysis_status") or "").strip().lower()
              if status == "failed":
                  failed.append(ad_id)
              elif status != "success":
                  unresolved.append(ad_id)

          print(f"Requested videos: {len(requested)}")
          print(f"Successful: {len(requested) - len(failed) - len(unresolved)}")
          print(f"Failed: {len(failed)}")
          print(f"Unresolved: {len(unresolved)}")

          if failed or unresolved:
              if failed:
                  print("Failed IDs:", ", ".join(sorted(failed)))
              if unresolved:
                  print("Unresolved IDs:", ", ".join(sorted(unresolved)))
              raise SystemExit(
                  "Video analysis did not complete for the full requested batch. "
                  "Refusing to publish an incomplete report."
              )
          PY

      - name: Commit weekly report and cache if changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- docs/data/latest.json data/video-analysis-cache.json

          if ! git diff --cached --quiet; then
            git commit -m 'Update Meta Ads weekly intelligence'
            git push origin HEAD:main
          else
            echo "No weekly intelligence changes to publish."
          fi
